ServerName localhost
ServerTokens Prod
ServerSignature Off

# Keep memory use small enough for a 512 MB host (Render's free tier).
# Each PHP worker uses roughly 30-40 MB, so cap how many can run at once.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        8
    MaxConnectionsPerChild   500
</IfModule>
